---
layout: default
title: Notes
---

<h1>Notes</h1>

<p>
  Occasional notes on theoretical computer science,
  mathematics, and related topics.
</p>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">
        {{ post.date | date: "%Y-%m-%d" }}
      </time>

      <a href="{{ post.url | relative_url }}">
        {{ post.title }}
      </a>
    </li>
  {% endfor %}
</ul>
